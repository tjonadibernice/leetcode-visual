      }
      chk = null;
      S.add(5, roads.length
        ? `Row ${i} is fully scanned. Every road out of city ${i} leads to a visited city, so dfs(${i}) is done. Return.`
        : `Nothing to explore from city ${i}, so dfs(${i}) returns right away.`, {i}, st());
      frames.pop(); path.pop(); cur = path.length ? path[path.length - 1] : null;
    }
    for (let i = 0; i < n; i++){
      if (visited[i]){
        S.add(10, `City ${i} is already visited. It joined province ${prov[i]} when we explored from an earlier city. Skip it.`, {i, provinces}, st());
        continue;
      }
      S.add(10, `City ${i} isn't visited, so no province we've found so far can reach it. It must start a <b>new province</b>.`, {i, provinces}, st());
      provinces++;
      S.add(11, `provinces = <b>${provinces}</b>. Now DFS from city ${i} to mark every city in this province.`, {i, provinces}, st());
      S.add(12, `Call dfs(${i}).`, {i, provinces}, st());
      dfs(i); cur = null;
      const mem = members(provinces);
      S.add(12, `Province ${provinces} is complete: ${mem.length === 1 ? `city ${mem[0]} on its own` : `cities <b>${mem.join(', ')}</b>`}. Continue with the next city.`, {i, provinces, visited: vis()}, st());
    }
    S.add(13, `All ${n} ${n === 1 ? 'city has' : 'cities have'} been checked. There ${provinces === 1 ? 'is' : 'are'} <b>${provinces}</b> province${provinces === 1 ? '' : 's'}.`, {result: provinces}, st());
    return S;
  }
});

/* ---------- 78. Subsets ---------- */
def({
  id: 'subsets', num: 78, title: 'Subsets', diff: 'Medium', cat: 'Graphs & Backtracking', pattern: 'Backtracking', slug: 'subsets',
  statement: 'Given an array of distinct numbers, return every possible subset.',
  idea: 'Every number gets a yes/no decision: <b>include</b> it or <b>skip</b> it. That makes a decision tree, and each path to the bottom is one subset. Backtracking walks this tree. The “undo” step (pop) lets one <code>path</code> list be reused for every branch.',
  time: 'O(n × 2ⁿ)', space: 'O(n) besides the output',
  params: [{name: 'nums', type: 'ints', def: '[1, 2, 3]', max: 4, min1: true}],
  code: [
    'def subsets(nums):',
    '    res, path = [], []',
    '    def backtrack(i):',
    '        if i == len(nums):',
    '            res.append(path[:])',
    '            return',
    '        path.append(nums[i])  # choice 1: include nums[i]',
    '        backtrack(i + 1)',
    '        path.pop()  # undo choice 1',
    '        backtrack(i + 1)  # choice 2: skip nums[i]',
    '    backtrack(0)',
    '    return res'],
  run({nums}){
    const S = mkSteps(), n = nums.length, nodes = {};
    let leafX = 0;
    (function build(id, path, d){
      const nd = {id, path, d, label: '[' + path.join(',') + ']'};
      nodes[id] = nd;
      if (d < n){ build(id + '1', [...path, nums[d]], d + 1); build(id + '0', path, d + 1); nd.x = (nodes[id + '1'].x + nodes[id + '0'].x) / 2; }
      else nd.x = leafX++;
    })('', [], 0);
    const maxLab = Math.max(...Object.values(nodes).map(nd => nd.label.length));
    const bw = Math.max(40, 12 + maxLab * 8), dx = bw + 10, dy = 66;
    const seen = new Set(), collected = new Set(); let active = '';
    const path = [], res = []; const frames = [];
    const tree = () => {
      const X = id => 10 + nodes[id].x * dx + bw / 2, Y = id => 16 + nodes[id].d * dy;
      const W = 20 + leafX * dx, H = 16 + n * dy + 34;
      let e = '', s = '';
      Object.values(nodes).forEach(nd => {
        if (nd.d < n){
          [['1', '+' + nums[nd.d]], ['0', 'skip']].forEach(([b, lab]) => {
            const c = nd.id + b, on = seen.has(c);
            e += `<line class="edge ${on ? 'on' : 'ghost'}" x1="${X(nd.id)}" y1="${Y(nd.id) + 28}" x2="${X(c)}" y2="${Y(c)}"/>`;
            e += `<text class="elab ${on ? 'on' : ''}" x="${(X(nd.id) + X(c)) / 2 + (b === '1' ? -6 : 6)}" y="${(Y(nd.id) + 28 + Y(c)) / 2}" text-anchor="${b === '1' ? 'end' : 'start'}">${lab}</text>`;
          });
        }
        const cls = nd.id === active ? 'active' : collected.has(nd.id) ? 'done' : seen.has(nd.id) ? '' : 'ghost';
        s += `<rect class="nd ${cls}" x="${X(nd.id) - bw / 2}" y="${Y(nd.id)}" width="${bw}" height="28" rx="7"/><text class="${cls === 'ghost' ? 't-muted' : ''}" x="${X(nd.id)}" y="${Y(nd.id) + 18}" text-anchor="middle" font-size="12" ${cls === 'ghost' ? 'opacity=".45"' : ''}>${esc(nd.label)}</text>`;
      });
      for (let d = 0; d <= n; d++) s += `<text class="t-muted" x="2" y="${16 + d * dy - 4}" font-size="10">i=${d}</text>`;
      return `<svg class="vz" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${e}${s}</svg>`;
    };
    const st = (newRes) => `<div class="pn" style="gap:14px">${tree()}${row(panel('path', note(esc(fmt(path)))), panel('res', resView(res, newRes)), stackView(frames))}</div>`;
    S.add(1, `res will hold the answers. path is the subset we're building right now. Faded boxes are parts of the decision tree we haven't explored yet.`, {path: '[]', res: '[]'}, st());
    function bt(i, id){
      frames.push(`backtrack(${i})`); active = id; seen.add(id);
      if (i === n){
        collected.add(id); res.push([...path]);
        S.add(4, `i = ${n}: every number has been decided. path = ${esc(fmt(path))} is one subset. Save a copy in res.`, {i, path: fmt(path), 'len(res)': res.length}, st(res.length - 1));
        frames.pop(); return;
      }
      S.add(3, `At i = ${i}, we decide about nums[${i}] = <b>${nums[i]}</b>.`, {i, path: fmt(path)}, st());
      path.push(nums[i]);
      S.add(6, `Choice 1: <b>include</b> ${nums[i]}. path = ${esc(fmt(path))}.`, {i, path: fmt(path)}, st());
      bt(i + 1, id + '1'); active = id;
      path.pop();
      S.add(8, `Back at i = ${i}. <b>Undo</b> choice 1: pop ${nums[i]}. path = ${esc(fmt(path))}. This is the “back” in backtracking.`, {i, path: fmt(path)}, st());
      S.add(9, `Choice 2: <b>skip</b> ${nums[i]} and move on.`, {i, path: fmt(path)}, st());
      bt(i + 1, id + '0'); active = id;
      frames.pop();
    }
    S.add(10, `Start the decision tree at the root, i = 0.`, {path: '[]'}, st());
    bt(0, ''); active = null;
    S.add(11, `Both choices were explored for every number. That gives 2<sup>${n}</sup> = <b>${res.length}</b> subsets.`, {result: fmt(res)}, st());
    return S;
  }
});

/* ================= input parsing ================= */
function parseParam(p, raw){
  raw = raw.trim();
  if (p.type === 'int'){
    const v = Number(raw);
    if (raw === '' || !Number.isInteger(v)) throw `${p.name} should be a whole number, like ${p.def}.`;
    if (p.lo != null && (v < p.lo || v > p.hi)) throw `${p.name} should be between ${p.lo} and ${p.hi} so the picture stays readable.`;
    return v;
  }
  if (p.type === 'str'){
    const v = raw.replace(/^["']|["']$/g, '');
    if (v.length > p.max) throw `${p.name} can be at most ${p.max} characters here.`;
    return v;
  }
  let v;
  try { v = JSON.parse(raw.replace(/'/g, '"').replace(/\bNone\b/g, 'null')); } catch (e) { throw `${p.name} should look like ${p.def}.`; }
  if (p.type === 'ints'){
    if (!Array.isArray(v) || !v.every(Number.isInteger)) throw `${p.name} should be a list of whole numbers, like ${p.def}.`;
    if (v.length > p.max) throw `${p.name} can have at most ${p.max} numbers here.`;
    if (p.min1 && !v.length) throw `${p.name} needs at least one number.`;
    if (p.min0 && (v.length < 2 || v.some(x => x < 0))) throw `${p.name} needs at least 2 walls, none negative.`;
    if (p.pos && (!v.length || v.some(x => x < 1))) throw `${p.name} needs positive coin values.`;
    if (p.id === undefined && p.name === 'nums' && p.max === 4 && new Set(v).size !== v.length) throw 'The numbers should all be different.';
    return v;
  }
  if (p.type === 'tree'){
    if (!Array.isArray(v) || !v.every(x => x === null || Number.isInteger(x))) throw `Write the tree in LeetCode's level order, like ${p.def}.`;
    if (v.filter(x => x !== null).length > p.max) throw `Keep the tree to ${p.max} nodes or fewer.`;
    return v;
  }
  if (p.type === 'grid'){
    if (!Array.isArray(v) || !v.length || !v.every(r => Array.isArray(r) && r.length === v[0].length && r.length)) throw 'The grid should be a list of equal-length rows, like [[1,0],[0,1]].';
    if (v.length > 7 || v[0].length > 8) throw 'Keep the grid to 7 rows and 8 columns or fewer.';
    const g = v.map(r => r.map(x => String(x)));
    if (!g.every(r => r.every(x => x === '0' || x === '1'))) throw 'Grid cells should be 1 (land) or 0 (water).';
    return g;
  }
  if (p.type === 'matrix'){
    if (!Array.isArray(v) || !v.length || !v.every(r => Array.isArray(r) && r.length === v.length)) throw `${p.name} should be a square matrix (n rows of n numbers), like [[1,1],[1,1]].`;
    if (v.length > p.max) throw `Keep it to ${p.max} cities or fewer so the picture stays readable.`;
    if (!v.every(r => r.every(x => x === 0 || x === 1))) throw 'Every entry should be 0 or 1.';
    if (v.some((r, i) => r[i] !== 1)) throw 'The diagonal should be all 1s, since every city is connected to itself.';
    if (v.some((r, i) => r.some((x, j) => x !== v[j][i]))) throw 'The matrix should be symmetric: if isConnected[i][j] is 1, isConnected[j][i] must be 1 too.';
    return v;
  }
}

/* ================= UI ================= */
const ui = {p: null, steps: [], i: 0, timer: null};
const nav = $('#nav'), pick = $('#pick');
(function buildNav(){
  let cat = '';
  PROBLEMS.forEach(p => {
    if (p.cat !== cat){ cat = p.cat; nav.insertAdjacentHTML('beforeend', `<div class="nav-cat">${cat}</div>`); pick.insertAdjacentHTML('beforeend', `<optgroup label="${cat}"></optgroup>`); }
    nav.insertAdjacentHTML('beforeend', `<button class="nav-item" type="button" data-id="${p.id}"><span class="n">${p.num}</span><span>${p.title}</span></button>`);
    pick.lastElementChild.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.num}. ${p.title}</option>`);
  });
})();
nav.addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) select(b.dataset.id); });
pick.addEventListener('change', () => select(pick.value));

function select(id){
  const p = PROBLEMS.find(x => x.id === id) || PROBLEMS[0];
  ui.p = p; stop();
  try { localStorage.setItem('stepwise-last', p.id); } catch (e) {}
  try { history.replaceState(null, '', '#' + p.id); } catch (e) {}
  nav.querySelectorAll('.nav-item').forEach(b => b.setAttribute('aria-current', b.dataset.id === p.id));
  pick.value = p.id;
  $('#meta').innerHTML = `<span class="chip num">#${p.num}</span><span class="chip ${p.diff.toLowerCase()}">${p.diff}</span><span class="chip">${p.pattern}</span>`;
  $('#title').textContent = p.title;
  $('#statement').innerHTML = p.statement;
  $('#lc').href = `https://leetcode.com/problems/${p.slug}/`;
  $('#idea').innerHTML = p.idea; $('#time').textContent = p.time; $('#space').textContent = p.space;
  $('#inputs').innerHTML = p.params.map(pp => `<div class="field"><label for="in-${p.id}-${pp.name}">${pp.name}</label><input id="in-${p.id}-${pp.name}" data-name="${pp.name}" value="${esc(pp.def)}" spellcheck="false"></div>`).join('')
    + `<button class="btn primary" type="submit">Run with this input</button><button class="btn" type="button" id="b-reset-in">Use example</button><p class="err" id="err" hidden></p>`;
  $('#b-reset-in').onclick = () => { p.params.forEach(pp => { $(`#in-${p.id}-${pp.name}`).value = pp.def; }); run(); };
  $('#code').innerHTML = p.code.map((l, k) => `<span class="ln" data-k="${k}"><span class="no">${k + 1}</span>${hl(l)}</span>`).join('');
  run();
}
$('#inputs').addEventListener('submit', e => { e.preventDefault(); run(); });

function run(){
  const p = ui.p, args = {}, err = $('#err');
  try {
    p.params.forEach(pp => { args[pp.name] = parseParam(pp, $(`#in-${p.id}-${pp.name}`).value); });
    if (p.id === 'subsets' && new Set(args.nums).size !== args.nums.length) throw 'The numbers should all be different.';
    if (p.id === 'coin-change' && args.coins.some(c => c > 20)) throw 'Keep coin values at 20 or below.';
    if (p.id === 'delete-bst'){
      const order = []; (function walk(n){ if (!n) return; walk(n.left); order.push(n.val); walk(n.right); })(buildTree(args.root));
      if (order.some((v, i) => i && v <= order[i - 1])) throw 'That tree isn\'t a valid BST. Each left child must be smaller than its parent, each right child bigger, and values must be unique.';
    }
  } catch (e) { err.textContent = String(e); err.hidden = false; return; }
  err.hidden = true; stop();
  ui.steps = p.run(args); ui.i = 0;
  $('#scrub').max = ui.steps.length - 1;
  show();
}

function show(){
  const s = ui.steps[ui.i], prev = ui.steps[ui.i - 1];
  $('#stage').innerHTML = s.html || '<div class="empty">nothing to draw</div>';
  $('#msg').innerHTML = s.msg;
  $('#counter').textContent = `Step ${ui.i + 1} of ${ui.steps.length}`;
  $('#scrub').value = ui.i;
  document.querySelectorAll('#code .ln').forEach(l => l.classList.toggle('on', +l.dataset.k === s.line));
  const v = s.vars || {}, pv = (prev && prev.vars) || {};
  const keys = Object.keys(v);
  $('#vars').innerHTML = keys.length ? keys.map(k => `<span class="var ${prev && pv[k] !== v[k] ? 'chg' : ''}"><span class="vn">${esc(k)} = </span>${esc(fmt(v[k]))}</span>`).join('') : '<span class="empty-v">none yet</span>';
  $('#b-prev').disabled = ui.i === 0; $('#b-first').disabled = ui.i === 0;
  $('#b-next').disabled = ui.i === ui.steps.length - 1; $('#b-last').disabled = ui.i === ui.steps.length - 1;
}
function go(i){ ui.i = Math.max(0, Math.min(ui.steps.length - 1, i)); show(); }
const PLAY = '<path d="M7 5v14l12-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
function stop(){ clearInterval(ui.timer); ui.timer = null; $('#i-play').innerHTML = PLAY; $('#b-play').setAttribute('aria-label', 'Play'); }
function play(){
  if (ui.timer){ stop(); return; }
  if (ui.i >= ui.steps.length - 1) go(0);
  $('#i-play').innerHTML = PAUSE; $('#b-play').setAttribute('aria-label', 'Pause');
  ui.timer = setInterval(() => { if (ui.i >= ui.steps.length - 1) stop(); else go(ui.i + 1); }, 1700 / +$('#speed').value);
}
$('#b-play').onclick = play;
$('#b-next').onclick = () => { stop(); go(ui.i + 1); };
$('#b-prev').onclick = () => { stop(); go(ui.i - 1); };
$('#b-first').onclick = () => { stop(); go(0); };
$('#b-last').onclick = () => { stop(); go(ui.steps.length - 1); };
$('#scrub').oninput = e => { stop(); go(+e.target.value); };
$('#speed').onchange = () => { if (ui.timer){ stop(); play(); } };
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); stop(); go(ui.i + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); stop(); go(ui.i - 1); }
  else if (e.key === ' '){ e.preventDefault(); play(); }
  else if (e.key === 'Home'){ stop(); go(0); }
  else if (e.key === 'End'){ stop(); go(ui.steps.length - 1); }
});

let start = (location.hash || '').slice(1);
if (!PROBLEMS.some(p => p.id === start)){ try { start = localStorage.getItem('stepwise-last') || ''; } catch (e) { start = ''; } }
select(start || PROBLEMS[0].id);
</script>
